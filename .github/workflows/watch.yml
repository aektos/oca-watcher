name: oca-watcher

# Un job tourne ~5h50 en vérifiant chaque minute.
# Le cron (toutes les 2h, à une minute "calme") garde toujours un run en attente :
# grâce à `concurrency`, il démarre dès que le précédent se termine, même si le cron est en retard.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # nécessaire pour se relancer soi-même
  issues: write    # alerte de secours : issue GitHub = email + notif app GitHub

concurrency:
  group: oca-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Restaurer l'état anti-doublon
        uses: actions/cache/restore@v4
        with:
          path: .oca-state.json
          key: oca-state-${{ github.run_id }}
          restore-keys: oca-state-

      - name: Surveiller (chaque minute pendant ~5h50)
        run: timeout 350m npx tsx cli.ts --interval 60 --github-issue --heartbeat 60 || [ $? -eq 124 ]
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sauvegarder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .oca-state.json
          key: oca-state-${{ github.run_id }}

      - name: Se relancer (jusqu'à la fin des JEP)
        if: success()   # pas de relance si échec ou annulation
        env:
          GH_TOKEN: ${{ github.token }}
          STOP_AT: "2026-09-20T17:00:00+02:00"
        run: |
          if [ "$(date +%s)" -lt "$(date -d "$STOP_AT" +%s)" ]; then
            gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            echo "Run suivant mis en file."
          else
            echo "JEP terminées, arrêt de la chaîne."
          fi
